<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Cloud</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

<div class="container">

    <h1>Biblioteca Cloud</h1>
<p style="text-align:center;color:#64748b;margin-bottom:30px;">
Gestiona tus libros almacenados en la nube mediante Supabase y Render.
</p>

    <form id="bookForm">

        <input
            type="text"
            id="titulo"
            placeholder="Título"
            required
        >

        <input
            type="text"
            id="autor"
            placeholder="Autor"
            required
        >

        <input
            type="text"
            id="categoria"
            placeholder="Categoría"
            required
        >

        <input
            type="number"
            id="anio"
            placeholder="Año"
            required
        >

        <button type="submit">
            Guardar Libro
        </button>

    </form>

    <h2>Listado de Libros</h2>

    <div id="books"></div>

</div>

<script src="app.js"></script>

</body>
</html>
